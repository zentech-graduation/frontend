name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint-pr-title:
    name: Lint PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            test
            chore
            docs
            perf
            ci
          requireScope: true
          scopes: |
            app
            auth
            dashboard
            routes
            layouts
            pages
            ui
            hooks
            services
            stores
            config
            assets
            build
            deps
            docs
            ci
          subjectPattern: ^[a-z].+$
          subjectPatternError: >
            The subject "{subject}" must start with a lowercase letter.
