name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint-pr-title:
    name: Lint PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            test
            chore
            docs
            perf
            ci
          requireScope: true
          # Domain scopes first, matching the backend's list, then the frontend's own layer
          # scopes. Three lists disagreed before this: the workflow allowed only layer scopes,
          # .claude/rules/git_workflow.md documented the backend's domain list, and the commits
          # actually being written used support, luvax, recommendation and common - none of which
          # the workflow allowed. A feature slice under src/features/ is named for its domain, so
          # the domain names are the ones a title naturally takes.
          scopes: |
            admin
            auth
            comment
            common
            hashtag
            luvax
            mail
            media
            message
            messages
            notification
            post
            recommendation
            report
            search
            social
            story
            support
            users
            app
            dashboard
            routes
            layouts
            pages
            ui
            hooks
            services
            stores
            config
            assets
            build
            deps
            db
            docs
            ci
          subjectPattern: ^[a-z].+$
          subjectPatternError: >
            The subject "{subject}" must start with a lowercase letter.
