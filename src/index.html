/**
 * Luvax Design System — CSS Token Library (v2)
 *
 * Light + dark theme via CSS custom properties.
 * Light is default; dark mode activates with `html[data-theme="dark"]`.
 *
 * NOTE — Font files not present on disk. The brand fonts (Syne, DM Sans, DM Mono,
 * Instrument Serif, Inter) were ANNOUNCED as uploaded but the .ttf bytes never landed.
 * Falling back to Google Fonts CDN. Once font files are in `fonts/`, swap @font-face
 * declarations to `local: url('../fonts/...')` paths.
 */

@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@300;400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap');


/* ─── LIGHT THEME (default) ──────────────────────────────────────── */

:root {
  /* Surface */
  --lx-base:            #F9F7F4;
  --lx-surface:         #F0EDE8;
  --lx-surface-raised:  #E8E3DC;
  --lx-surface-sunken:  #EAE6E0;

  /* Ink */
  --lx-ink:             #1A1816;
  --lx-ink-2:           #574F47;
  --lx-ink-3:           #9B9088;
  --lx-ink-inverse:     #F9F7F4;

  /* Borders */
  --lx-border:          #DDD7CF;
  --lx-border-strong:   #C4BCB2;
  --lx-border-subtle:   #ECEAE5;

  /* Accent — overwritten via tweaks */
  --lx-accent:          #C8A97E;
  --lx-accent-dark:     #A8885A;
  --lx-accent-dim:      #F2EAD9;
  --lx-accent-text:     #7A5C34;

  /* Semantic */
  --lx-error:           #C47168;
  --lx-error-dim:       #F5E8E7;
  --lx-error-text:      #A55B52;
  --lx-success:         #7A9E7A;
  --lx-success-dim:     #EAF0EA;
  --lx-success-text:    #5E8260;
  --lx-warning:         #C4A85A;
  --lx-warning-dim:     #F5EED8;
  --lx-warning-text:    #A88A3A;

  /* Glass / scrim */
  --lx-glass-bg:        rgba(249, 247, 244, 0.88);
  --lx-glass-border:    rgba(255, 255, 255, 0.4);
  --lx-glass-blur:      10px;
  --lx-scrim:           rgba(26, 24, 22, 0.45);

  /* Type families — overwritten via tweaks */
  --font-display:       'Syne', sans-serif;
  --font-body:          'DM Sans', sans-serif;
  --font-mono:          'DM Mono', monospace;

  /* Shadows */
  --shadow-sm:          0 1px 3px rgba(26,24,22,0.07);
  --shadow-md:          0 2px 8px rgba(26,24,22,0.09);
  --shadow-lg:          0 4px 12px rgba(26,24,22,0.12);

  /* Spacing */
  --space-1: 4px;  --space-2: 8px;  --space-3: 12px; --space-4: 16px;
  --space-6: 24px; --space-8: 32px; --space-12: 48px; --space-16: 64px;

  /* Radius */
  --radius-sm: 4px; --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px; --radius-pill: 999px;

  /* Motion */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --duration-fast: 150ms;
  --duration-normal: 200ms;
}


/* ─── DARK THEME ─────────────────────────────────────────────────── */

html[data-theme="dark"] {
  --lx-base:            #1A1816;
  --lx-surface:         #25211D;
  --lx-surface-raised:  #2F2A25;
  --lx-surface-sunken:  #1F1C19;

  --lx-ink:             #F0EDE8;
  --lx-ink-2:           #B5ACA3;
  --lx-ink-3:           #7A7268;
  --lx-ink-inverse:     #1A1816;

  --lx-border:          #3A342E;
  --lx-border-strong:   #4A433B;
  --lx-border-subtle:   #2E2925;

  /* Accent stays warm — but dim is reduced opacity */
  --lx-accent-dim:      rgba(200, 169, 126, 0.18);
  --lx-accent-text:     #D8BC92;

  --lx-error-dim:       rgba(196, 113, 104, 0.18);
  --lx-error-text:      #D89189;
  --lx-success-dim:     rgba(122, 158, 122, 0.18);
  --lx-success-text:    #9DBE9D;
  --lx-warning-dim:     rgba(196, 168, 90, 0.18);
  --lx-warning-text:    #DBC57E;

  --lx-glass-bg:        rgba(26, 24, 22, 0.85);
  --lx-glass-border:    rgba(255, 255, 255, 0.08);
  --lx-scrim:           rgba(0, 0, 0, 0.65);
}


/* ─── BASE ──────────────────────────────────────────────────────── */

* { box-sizing: border-box; }

html, body {
  background: var(--lx-base);
  color: var(--lx-ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  transition: background-color 200ms ease, color 200ms ease;
}


/* ─── TYPOGRAPHY UTILITY CLASSES ─────────────────────────────────── */

.t-display-xl { font: 800 64px/1.1 var(--font-display); letter-spacing: -0.03em; color: var(--lx-ink); }
.t-display-lg { font: 700 48px/1.1 var(--font-display); letter-spacing: -0.03em; color: var(--lx-ink); }
.t-display-md { font: 600 38px/1.2 var(--font-display); letter-spacing: -0.02em; color: var(--lx-ink); }
.t-h1 { font: 600 30px/1.25 var(--font-display); letter-spacing: -0.02em; color: var(--lx-ink); }
.t-h2 { font: 600 24px/1.3 var(--font-display); letter-spacing: -0.02em; color: var(--lx-ink); }
.t-h3 { font: 500 20px/1.3 var(--font-display); letter-spacing: -0.01em; color: var(--lx-ink); }
.t-h4 { font: 600 15px/1.4 var(--font-body); color: var(--lx-ink); }

.t-body-lg { font: 400 17px/1.5 var(--font-body); letter-spacing: -0.01em; color: var(--lx-ink); }
.t-body    { font: 400 15px/1.5 var(--font-body); letter-spacing: -0.01em; color: var(--lx-ink); }
.t-body-sm { font: 400 13px/1.5 var(--font-body); color: var(--lx-ink-2); }

.t-label   { font: 500 13px/1.3 var(--font-body); letter-spacing: 0.04em; color: var(--lx-ink); }
.t-label-sm{ font: 500 11px/1.3 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--lx-ink-3); }
.t-caption { font: 400 11px/1.5 var(--font-body); color: var(--lx-ink-3); }

.t-mono    { font: 400 13px/1.5 var(--font-mono); color: var(--lx-ink-2); }
.t-mono-sm { font: 400 11px/1.5 var(--font-mono); color: var(--lx-ink-3); }


/* ─── GLASS UTILITY ─────────────────────────────────────────────── */

.lx-glass {
  background: var(--lx-glass-bg);
  backdrop-filter: blur(var(--lx-glass-blur));
  -webkit-backdrop-filter: blur(var(--lx-glass-blur));
  border: 1px solid var(--lx-glass-border);
}


/* ─── DENSITY DATA-ATTR (applied to .lx-app root) ───────────────── */

[data-density="cozy"]  { --lx-row-pad: 14px; --lx-card-pad: 16px; --lx-feed-gap: 12px; }
[data-density="dense"] { --lx-row-pad: 10px; --lx-card-pad: 12px; --lx-feed-gap: 8px; }


/* ─── SCROLLBAR (subtle) ────────────────────────────────────────── */

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--lx-border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--lx-border-strong); }

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', noDeckControls = false, children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  // Auto-inject a rail toggle when a <deck-stage> is on the page. The
  // toggle drives the deck's per-viewer _railVisible via window message;
  // state is mirrored from the same localStorage key the deck reads so
  // the control reflects reality across reloads. The mechanism is the
  // message — authors who want custom placement can post it directly
  // and pass noDeckControls to suppress this one.
  const hasDeckStage = React.useMemo(
    () => typeof document !== 'undefined' && !!document.querySelector('deck-stage'),
    [],
  );
  // deck-stage enables its rail in connectedCallback, but this panel can
  // mount before that element has upgraded. The initial read catches the
  // common case; the listener covers mounting first. (Older deck-stage.js
  // copies still wait for the host's __omelette_rail_enabled postMessage —
  // same listener handles those.)
  const [railEnabled, setRailEnabled] = React.useState(
    () => hasDeckStage && !!document.querySelector('deck-stage')?._railEnabled,
  );
  React.useEffect(() => {
    if (!hasDeckStage || railEnabled) return undefined;
    const onMsg = (e) => {
      if (e.data && e.data.type === '__omelette_rail_enabled') setRailEnabled(true);
    };
    window.addEventListener('message', onMsg);
    return () => window.removeEventListener('message', onMsg);
  }, [hasDeckStage, railEnabled]);
  const [railVisible, setRailVisible] = React.useState(() => {
    try { return localStorage.getItem('deck-stage.railVisible') !== '0'; } catch (e) { return true; }
  });
  const toggleRail = (on) => {
    setRailVisible(on);
    window.postMessage({ type: '__deck_rail_visible', on }, '*');
  };
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
          {hasDeckStage && railEnabled && !noDeckControls && (
            <TweakSection label="Deck">
              <TweakToggle label="Thumbnail rail" value={railVisible} onChange={toggleRail} />
            </TweakSection>
          )}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

  ink2:        'var(--lx-ink-2)',
  ink3:        'var(--lx-ink-3)',

  border:      'var(--lx-border)',

  borderSubtle:'var(--lx-border-subtle)',
  accent:      'var(--lx-accent)',
  accentDark:  'var(--lx-accent-dark)',

// ─── Viewport hook ────────────────────────────────────────────────

function useViewport() {

  const [vp, setVp] = useState(get);
  useEffect(() => {
    const handler = () => setVp(get());
    window.addEventListener('resize', handler);
    return () => window.removeEventListener('resize', handler);
  }, []);

}

const ICONS = {

  settings: <><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></>,
  chevronRight: <polyline points="9 18 15 12 9 6"/>,
  send:     <><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></>,
  more:     <><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/><circle cx="5" cy="12" r="1.5"/></>,
  check:    <polyline points="20 6 9 17 4 12"/>,

};

function LxIcon({ name, size = 20, color, filled = false, stroke = 1.5 }) {
  const node = ICONS[name];
  if (!node) return null;
  return (
    <svg width={size} height={size} viewBox="0 0 24 24"
         fill={filled ? (color || v.ink) : 'none'}
         stroke={color || v.ink}
         strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round">

    </svg>

}

// ─── Avatar ──────────────────────────────────────────────────────

const AVATAR_COLORS = ['#C8A97E', '#7A9E7A', '#9B7EA8', '#7A9EB8', '#C47168', '#B89468', '#5E8260'];

function LxAvatar({ size = 36, idx = 0, ring = false, hasStory = false, viewed = false }) {
  const color = AVATAR_COLORS[idx % AVATAR_COLORS.length];
  if (hasStory) {
    return (
      <div style={{
        width: size + 6, height: size + 6,
        borderRadius: '50%',
        padding: 2,
        background: viewed ? v.border : v.accent,
        flexShrink: 0,

        <div style={{
          width: '100%', height: '100%', borderRadius: '50%',
          background: color, border: `2px solid ${v.base}`,

// ─── Tag / chip ──────────────────────────────────────────────────

function LxTag({ children, active = false, onClick, size = 'md' }) {
  const sizes = {
    sm: { fontSize: 11, padding: '3px 9px' },
    md: { fontSize: 12, padding: '5px 12px' },
  };
  return (
    <span onClick={onClick} style={{
      display: 'inline-flex', alignItems: 'center', gap: 3,
      fontFamily: v.fontBody, fontWeight: 500,
      borderRadius: 999,
      background: active ? v.accentDim : v.surface,

      border: `1px solid ${active ? 'transparent' : 'var(--lx-border)'}`,
      cursor: onClick ? 'pointer' : 'default',
      whiteSpace: 'nowrap',
      ...sizes[size],
    }}>{children}</span>
  );
}

// ─── Button ──────────────────────────────────────────────────────

function LxBtn({ children, variant = 'primary', size = 'md', onClick, disabled = false, style = {} }) {
  const sizes = {
    sm: { fontSize: 12, padding: '5px 14px' },
    md: { fontSize: 14, padding: '9px 20px' },
    lg: { fontSize: 16, padding: '12px 28px' },
  };
  const variants = {
    primary:   { background: v.accent, color: v.inkInverse, border: 'none' },
    secondary: { background: v.surface, color: v.ink, border: `1px solid ${v.border}` },
    ghost:     { background: 'transparent', color: v.ink, border: `1px solid ${v.border}` },
    danger:    { background: 'transparent', color: v.error, border: `1px solid ${v.error}` },

    <button onClick={onClick} disabled={disabled} style={{
      fontFamily: v.fontBody, fontWeight: 500, borderRadius: 999,
      cursor: disabled ? 'default' : 'pointer', letterSpacing: '-0.01em',

        background: v.base,

// ─── Top Tab Strip (Facebook-style icon tabs in app bar) ─────────

function LxTopTabs({ active, navigate }) {
  const tabs = [
    { id: 'feed', icon: 'home', label: 'home' },

// ─── Persistent App Bar (Facebook-style) ─────────────────────────
// Rendered once at App level. Content swaps based on screen context
// but the element itself stays mounted — no flicker on navigation.

function LxAppBar({ screen, navigate, params, viewport }) {
  // Main tabs (logo + tab strip + right actions)
  const isMainTab = ['feed', 'explore', 'compose', 'notifications', 'profile'].includes(screen);

  // Subpage context (back + title)
  const subpages = {
    post: 'post',
    settings: 'settings',
  };
  const isSubpage = subpages[screen];

  // Match the body layout widths so the navbar sits over the same columns.
  // Desktop: 300 (spacer) + 680 (feed) + 300 (rail) = 1280.
  // Tablet:  body is constrained to 640.
  const innerMaxWidth = viewport === 'desktop' ? 1280 : viewport === 'tablet' ? 640 : '100%';
  const sideWidth     = viewport === 'desktop' ? 300  : viewport === 'tablet' ? 'auto' : 'auto';

  return (
    <header style={{
      position: 'sticky', top: 0, zIndex: 100,
      height: 56, flexShrink: 0,
      display: 'flex', justifyContent: 'center',
      background: 'var(--lx-glass-bg)',
      backdropFilter: 'blur(12px)', WebkitBackdropFilter: 'blur(12px)',
      borderBottom: `1px solid ${v.border}`,
    }}>
      <div style={{
        width: '100%', maxWidth: innerMaxWidth,
        display: 'flex', alignItems: 'stretch',
        padding: '0 16px', gap: 12,
      }}>
        {/* Left: logo OR back — sits over the left spacer column on desktop */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexShrink: 0, width: sideWidth, minWidth: viewport === 'mobile' ? 'auto' : (viewport === 'tablet' ? 120 : undefined) }}>
          {isSubpage ? (
            <>
              <button onClick={() => navigate('feed')} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 4, marginLeft: -4, display: 'flex', alignItems: 'center' }}>
                <LxIcon name="back" size={20} color={v.ink} />
              </button>
              <span style={{ fontFamily: v.fontBody, fontSize: 15, fontWeight: 600, color: v.ink }}>{isSubpage}</span>
            </>
          ) : (
            <button onClick={() => navigate('feed')} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 0, fontFamily: v.fontDisplay, fontSize: 22, fontWeight: 700, color: v.ink, letterSpacing: '-0.03em' }}>
              luvax
            </button>
          )}
        </div>

        {/* Center: tab strip on main pages (desktop/tablet only) — sits over the feed column */}
        {isMainTab && viewport !== 'mobile' && (
          <LxTopTabs active={screen} navigate={navigate} />
        )}

        {/* Right: search/notif/profile — sits over the rail column on desktop */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexShrink: 0, width: sideWidth, minWidth: viewport === 'mobile' ? 'auto' : (viewport === 'tablet' ? 120 : undefined), justifyContent: 'flex-end' }}>
          {viewport !== 'mobile' && (
            <button onClick={() => navigate('explore')} style={{
              background: v.surface, border: 'none', borderRadius: 999,
              padding: '8px 12px', cursor: 'pointer',
              display: 'flex', alignItems: 'center', gap: 6,
              color: v.ink3, fontFamily: v.fontBody, fontSize: 13,
            }}>
              <LxIcon name="explore" size={15} color={v.ink3} />
              <span>search</span>
            </button>
          )}
          <button style={{ background: v.surface, border: 'none', borderRadius: '50%', width: 36, height: 36, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative' }}>
            <LxIcon name="bell" size={18} color={v.ink2} />
            <span style={{ position: 'absolute', top: 6, right: 6, width: 7, height: 7, borderRadius: '50%', background: v.accent }} />
          </button>
          <button onClick={() => navigate('profile')} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 0 }}>
            <LxAvatar size={32} idx={0} ring={screen === 'profile'} />
          </button>
        </div>
      </div>
    </header>
  );
}

// ─── Persistent Bottom Nav (mobile only) ─────────────────────────

function LxBottomNav({ active, navigate }) {

function LxSidebar({ active, navigate }) {

// ─── Right rail (desktop) ────────────────────────────────────────

function LxRightRail() {
  const trending = ['light', 'analog', 'morning', 'silence', 'film', 'observation'];
  const suggested = [
    { idx: 1, name: 'sol.r',  bio: 'morning, window, coffee' },

              <span style={{ fontFamily: v.fontMono, fontSize: 11, color: v.ink3, width: 18 }}>{String(i+1).padStart(2,'0')}</span>
              <span style={{ fontFamily: v.fontBody, fontSize: 14, color: v.ink, fontWeight: 500 }}>#{t}</span>

        </div>
      </div>

      <div>
        <div style={{ fontFamily: v.fontMono, fontSize: 10, color: v.ink3, letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 12 }}>suggested</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          {suggested.map(u => (
            <div key={u.name} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <LxAvatar size={36} idx={u.idx} />
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontFamily: v.fontBody, fontSize: 13, fontWeight: 600, color: v.ink }}>{u.name}</div>
                <div style={{ fontFamily: v.fontBody, fontSize: 11, color: v.ink3, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{u.bio}</div>
              </div>
              <LxBtn variant="ghost" size="sm">follow</LxBtn>
            </div>
          ))}
        </div>
      </div>
    </aside>

}

// ─── Persistent App Shell ────────────────────────────────────────
// Nav chrome is rendered ONCE here — never unmounts during screen change.
// Screens only render their body content.

function LxShell({ screen, navigate, params, children, showRightRail = true }) {
  const vp = useViewport();

  if (vp === 'desktop') {
    const RAIL_W = 300;
    return (
      <div style={{ minHeight: '100vh', background: v.base, display: 'flex', flexDirection: 'column' }}>
        <LxAppBar screen={screen} navigate={navigate} params={params} viewport={vp} />
        <div style={{ display: 'flex', flex: 1, justifyContent: 'center', alignItems: 'flex-start' }}>
          {/* Left spacer mirrors the right rail so the feed is centered in the viewport */}
          {showRightRail && <div style={{ width: RAIL_W, flexShrink: 0 }} aria-hidden="true" />}
          <main style={{
            width: 680, flexShrink: 0, minWidth: 0,
            borderLeft: `1px solid ${v.border}`,
            borderRight: `1px solid ${v.border}`,
            minHeight: 'calc(100vh - 56px)',
            display: 'flex', flexDirection: 'column',
          }}>
            {children}
          </main>
          {showRightRail && <LxRightRail />}
        </div>
      </div>
    );
  }

  if (vp === 'tablet') {
    return (
      <div style={{ minHeight: '100vh', background: v.base, display: 'flex', flexDirection: 'column', maxWidth: 640, margin: '0 auto', borderLeft: `1px solid ${v.border}`, borderRight: `1px solid ${v.border}` }}>
        <LxAppBar screen={screen} navigate={navigate} params={params} viewport={vp} />
        <main style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
          {children}
        </main>
        <LxBottomNav active={screen} navigate={navigate} />
      </div>
    );
  }

  // mobile
  return (
    <div style={{ minHeight: '100vh', background: v.base, display: 'flex', flexDirection: 'column' }}>
      <LxAppBar screen={screen} navigate={navigate} params={params} viewport={vp} />
      <main style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
        {children}
      </main>
      <LxBottomNav active={screen} navigate={navigate} />
    </div>
  );
}

Object.assign(window, {
  v, useViewport, LxIcon, LxAvatar, LxTag, LxBtn, LxDivider,
  LxBottomSheet, LxTopBar, LxBottomNav, LxSidebar, LxRightRail, LxShell, LxAppBar, LxTopTabs,
  AVATAR_COLORS,
});

</script>

          <button key={m} onClick={() => setMode(m)} style={{
            background: mode === m ? 'rgba(255,255,255,0.12)' : 'transparent',
            border: '1px solid ' + (mode === m ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.12)'),

  return (

<script type="text/babel">
// ── Composer.jsx ──────────────────────────────────────────────────────────
// Composer.jsx — post composer with type tabs (photo / video / text)

const SUGGESTED_TAGS = ['observation', 'photography', 'writing', 'light', 'analog', 'film', 'silence', 'texture', 'morning', 'film2025'];

function ComposerScreen({ navigate }) {
  const [type, setType] = React.useState('text'); // text | photo | video
  const [caption, setCaption] = React.useState('');
  const [selectedTags, setSelectedTags] = React.useState([]);
  const maxChars = 280;

  // Auto-extract hashtags from caption
  const captionTags = React.useMemo(() => {
    const matches = caption.match(/#(\w+)/g) || [];
    return matches.map(m => m.slice(1).toLowerCase());
  }, [caption]);

  const allTags = Array.from(new Set([...captionTags, ...selectedTags]));

  const toggleTag = (tag) => {
    setSelectedTags(prev =>
      prev.includes(tag) ? prev.filter(t => t !== tag) : [...prev, tag]
    );
  };

  const insertTag = (tag) => {
    if (!caption.includes(`#${tag}`)) {
      setCaption(c => c ? `${c} #${tag}` : `#${tag}`);
    }
  };

  return (
    <>
      {/* Sub-toolbar: cancel + post button (AppBar already shows back + title) */}
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '10px 16px', borderBottom: `1px solid ${v.border}`,
        background: v.base,
      }}>
        <span style={{ fontFamily: v.fontBody, fontSize: 13, fontWeight: 500, color: v.ink2 }}>new post</span>
        <button onClick={() => navigate('feed')} disabled={!caption.trim() && type === 'text'}
          style={{
            fontFamily: v.fontBody, fontSize: 14, fontWeight: 600,
            background: (!caption.trim() && type === 'text') ? v.surfaceRaised : v.accent,
            color: (!caption.trim() && type === 'text') ? v.ink3 : v.inkInverse,
            border: 'none', borderRadius: 999, padding: '7px 16px',
            cursor: (!caption.trim() && type === 'text') ? 'default' : 'pointer',
          }}>
          post it
        </button>
      </div>

      <div style={{ flex: 1, overflowY: 'auto', paddingBottom: 24 }}>
        {/* Type tabs */}
        <div style={{
          display: 'flex', gap: 0, padding: '12px 16px 4px',
          borderBottom: `1px solid ${v.border}`,
        }}>
          {[['text', 'type', 'text'], ['photo', 'image', 'photo'], ['video', 'video', 'video']].map(([t, ic, label]) => (
            <button key={t} onClick={() => setType(t)} style={{
              flex: 1, background: 'none', border: 'none', cursor: 'pointer',
              padding: '10px 0',
              borderBottom: type === t ? `2px solid ${v.ink}` : '2px solid transparent',
              marginBottom: -1,
              display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
              fontFamily: v.fontBody, fontSize: 13, fontWeight: type === t ? 600 : 500,
              color: type === t ? v.ink : v.ink3,
            }}>
              <LxIcon name={ic} size={16} color={type === t ? v.ink : v.ink3} />
              {label}
            </button>
          ))}
        </div>

        {/* Author + composer */}
        <div style={{ display: 'flex', gap: 12, padding: '20px 16px 0' }}>
          <LxAvatar size={36} idx={0} />
          <div style={{ flex: 1 }}>
            <div style={{ fontFamily: v.fontBody, fontSize: 13, fontWeight: 600, color: v.ink, marginBottom: 8 }}>you</div>

            {type === 'photo' && (
              <div style={{
                aspectRatio: '4/5', background: v.surfaceSunken,
                borderRadius: 12, border: `1px dashed ${v.border}`,
                display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 8,
                cursor: 'pointer', marginBottom: 14,
              }}>
                <LxIcon name="image" size={36} color={v.ink3} />
                <span style={{ fontFamily: v.fontBody, fontSize: 13, color: v.ink2 }}>tap to add a photo</span>
                <span style={{ fontFamily: v.fontMono, fontSize: 10, color: v.ink3 }}>jpg, png · max 10MB</span>
              </div>
            )}
            {type === 'video' && (
              <div style={{
                aspectRatio: '4/5', background: v.surfaceSunken,
                borderRadius: 12, border: `1px dashed ${v.border}`,
                display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 8,
                cursor: 'pointer', marginBottom: 14,
              }}>
                <LxIcon name="video" size={36} color={v.ink3} />
                <span style={{ fontFamily: v.fontBody, fontSize: 13, color: v.ink2 }}>tap to add a video</span>
                <span style={{ fontFamily: v.fontMono, fontSize: 10, color: v.ink3 }}>mp4 · max 60s · 50MB</span>
              </div>
            )}

            <textarea
              value={caption}
              onChange={e => setCaption(e.target.value.slice(0, maxChars))}
              placeholder={type === 'text' ? 'say something real...' : 'add a caption (optional)'}
              style={{
                width: '100%', fontFamily: v.fontBody,
                fontSize: type === 'text' ? 17 : 14, color: v.ink,
                background: 'transparent', border: 'none', outline: 'none',
                resize: 'none', lineHeight: 1.55, letterSpacing: '-0.01em',
                minHeight: type === 'text' ? 120 : 60, padding: 0,
              }}
            />
          </div>
        </div>

        {/* Hashtag suggestions */}
        <div style={{ padding: '8px 16px 4px', marginLeft: 48 }}>
          <div style={{ fontFamily: v.fontMono, fontSize: 9, color: v.ink3, letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 8, display: 'flex', alignItems: 'center', gap: 6 }}>
            <LxIcon name="hash" size={12} color={v.ink3} />
            hashtags {allTags.length > 0 && <span style={{ color: v.accentText, marginLeft: 4 }}>({allTags.length})</span>}
          </div>
          <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
            {SUGGESTED_TAGS.map(t => (
              <LxTag key={t} active={allTags.includes(t)} onClick={() => captionTags.includes(t) ? null : insertTag(t)}>
                #{t}
              </LxTag>
            ))}
          </div>
        </div>

        <LxDivider />

        {/* Bottom action bar */}
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '14px 16px' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontFamily: v.fontMono, fontSize: 11, color: v.ink3 }}>
            <LxIcon name="hash" size={13} color={v.ink3} />
            <span>auto-tagged: {captionTags.length}</span>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            {caption.length > 0 && (
              <div style={{
                width: 22, height: 22, borderRadius: '50%',
                background: `conic-gradient(var(--lx-accent) ${caption.length / maxChars * 360}deg, var(--lx-surface-raised) 0deg)`,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
              }}>
                <div style={{ width: 17, height: 17, borderRadius: '50%', background: v.base }} />
              </div>
            )}
            <span style={{
              fontFamily: v.fontMono, fontSize: 11,
              color: caption.length > maxChars * 0.9 ? v.error : v.ink3,
            }}>
              {maxChars - caption.length}
            </span>
          </div>
        </div>
      </div>
    </>
  );
}

Object.assign(window, { ComposerScreen });

</script>

<script type="text/babel">
// ── Onboarding.jsx ────────────────────────────────────────────────────────
// Onboarding.jsx — multi-step signup flow

const INTEREST_CATEGORIES = [
  'photography', 'writing', 'film', 'analog', 'design', 'architecture',
  'music', 'reading', 'nature', 'travel', 'art', 'food',
  'cycling', 'running', 'coffee', 'minimalism',
];

function OnboardingScreen({ navigate }) {
  const [step, setStep] = React.useState(0);
  const [data, setData] = React.useState({
    email: '', password: '', username: '', displayName: '', bio: '', interests: [],
  });

  const next = () => setStep(s => s + 1);
  const back = () => setStep(s => Math.max(0, s - 1));
  const update = (k, v) => setData(d => ({ ...d, [k]: v }));
  const toggleInterest = (i) => setData(d => ({
    ...d,
    interests: d.interests.includes(i) ? d.interests.filter(x => x !== i) : [...d.interests, i],
  }));

  const steps = [
    // 0 — welcome
    {
      validate: () => true,
      render: () => (
        <div style={{ textAlign: 'center', paddingTop: 60 }}>
          <div style={{ fontFamily: v.fontDisplay, fontSize: 72, fontWeight: 800, color: v.ink, letterSpacing: '-0.04em', lineHeight: 0.95, marginBottom: 16 }}>luvax</div>
          <p style={{ fontFamily: v.fontBody, fontSize: 17, color: v.ink2, lineHeight: 1.5, maxWidth: 320, margin: '0 auto 40px', letterSpacing: '-0.01em' }}>
            a light-first social network.<br />pure social, no noise.
          </p>
          <LxBtn variant="primary" size="lg" onClick={next} style={{ minWidth: 200 }}>get started</LxBtn>
          <div style={{ marginTop: 16, fontFamily: v.fontBody, fontSize: 13, color: v.ink3 }}>
            already have an account? <span style={{ color: v.ink, cursor: 'pointer', fontWeight: 500 }} onClick={() => navigate('feed')}>sign in</span>
          </div>
        </div>
      ),
    },
    // 1 — email + password
    {
      validate: () => data.email.includes('@') && data.password.length >= 8,
      render: () => (
        <div>
          <h1 style={{ fontFamily: v.fontDisplay, fontSize: 30, fontWeight: 700, color: v.ink, letterSpacing: '-0.02em', marginBottom: 4 }}>create your account</h1>
          <p style={{ fontFamily: v.fontBody, fontSize: 14, color: v.ink2, marginBottom: 28 }}>start with the basics. you can change everything later.</p>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            <div>
              <label style={{ display: 'block', fontFamily: v.fontBody, fontSize: 12, fontWeight: 500, color: v.ink2, marginBottom: 6 }}>email</label>
              <input type="email" value={data.email} onChange={e => update('email', e.target.value)} placeholder="you@example.com"
                style={inputStyle()} />
            </div>
            <div>
              <label style={{ display: 'block', fontFamily: v.fontBody, fontSize: 12, fontWeight: 500, color: v.ink2, marginBottom: 6 }}>password</label>
              <input type="password" value={data.password} onChange={e => update('password', e.target.value)} placeholder="at least 8 characters"
                style={inputStyle()} />
              <div style={{ fontFamily: v.fontMono, fontSize: 10, color: v.ink3, marginTop: 6 }}>
                {data.password.length >= 8 ? '✓ strong enough' : `${data.password.length}/8`}
              </div>
            </div>
          </div>
        </div>
      ),
    },
    // 2 — username
    {
      validate: () => data.username.length >= 3 && /^[a-z0-9._]+$/.test(data.username),
      render: () => (
        <div>
          <h1 style={{ fontFamily: v.fontDisplay, fontSize: 30, fontWeight: 700, color: v.ink, letterSpacing: '-0.02em', marginBottom: 4 }}>pick a handle</h1>
          <p style={{ fontFamily: v.fontBody, fontSize: 14, color: v.ink2, marginBottom: 28 }}>this is how people will find you. lowercase letters, numbers, periods, and underscores.</p>

          <label style={{ display: 'block', fontFamily: v.fontBody, fontSize: 12, fontWeight: 500, color: v.ink2, marginBottom: 6 }}>username</label>
          <div style={{ position: 'relative' }}>
            <span style={{ position: 'absolute', left: 14, top: '50%', transform: 'translateY(-50%)', fontFamily: v.fontMono, fontSize: 14, color: v.ink3 }}>@</span>
            <input value={data.username} onChange={e => update('username', e.target.value.toLowerCase())} placeholder="your.handle"
              style={{ ...inputStyle(), paddingLeft: 30 }} />
          </div>
          {data.username.length > 0 && (
            <div style={{ fontFamily: v.fontMono, fontSize: 10, color: data.username.length >= 3 && /^[a-z0-9._]+$/.test(data.username) ? v.successText : v.errorText, marginTop: 6 }}>
              {data.username.length >= 3 && /^[a-z0-9._]+$/.test(data.username) ? '✓ looks good' : 'min 3 chars, lowercase only'}
            </div>
          )}

          <div style={{ marginTop: 28 }}>
            <label style={{ display: 'block', fontFamily: v.fontBody, fontSize: 12, fontWeight: 500, color: v.ink2, marginBottom: 6 }}>display name <span style={{ color: v.ink3, fontWeight: 400 }}>(optional)</span></label>
            <input value={data.displayName} onChange={e => update('displayName', e.target.value)} placeholder="what to call you"
              style={inputStyle()} />
          </div>
        </div>
      ),
    },
    // 3 — bio + interests
    {
      validate: () => data.interests.length >= 3,
      render: () => (
        <div>
          <h1 style={{ fontFamily: v.fontDisplay, fontSize: 30, fontWeight: 700, color: v.ink, letterSpacing: '-0.02em', marginBottom: 4 }}>what's your scene?</h1>
          <p style={{ fontFamily: v.fontBody, fontSize: 14, color: v.ink2, marginBottom: 24 }}>pick at least 3. we'll use these to shape your feed.</p>

          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 24 }}>
            {INTEREST_CATEGORIES.map(i => (
              <LxTag key={i} active={data.interests.includes(i)} onClick={() => toggleInterest(i)}>
                {i}
              </LxTag>
            ))}
          </div>

          <div>
            <label style={{ display: 'block', fontFamily: v.fontBody, fontSize: 12, fontWeight: 500, color: v.ink2, marginBottom: 6 }}>bio <span style={{ color: v.ink3, fontWeight: 400 }}>(optional)</span></label>
            <textarea value={data.bio} onChange={e => update('bio', e.target.value.slice(0, 160))} placeholder="a sentence about you"
              style={{ ...inputStyle(), resize: 'none', minHeight: 64, lineHeight: 1.5 }} />
            <div style={{ fontFamily: v.fontMono, fontSize: 10, color: v.ink3, marginTop: 4, textAlign: 'right' }}>{160 - data.bio.length}</div>
          </div>
        </div>
      ),
    },
    // 4 — done
    {
      validate: () => true,
      render: () => (
        <div style={{ textAlign: 'center', paddingTop: 60 }}>
          <div style={{ fontFamily: v.fontDisplay, fontSize: 44, fontWeight: 700, color: v.ink, letterSpacing: '-0.02em', lineHeight: 1.1, marginBottom: 16 }}>
            welcome,<br />@{data.username || 'friend'}.
          </div>
          <p style={{ fontFamily: v.fontBody, fontSize: 15, color: v.ink2, lineHeight: 1.5, maxWidth: 300, margin: '0 auto 40px' }}>
            we sent a verification link to <strong style={{ color: v.ink }}>{data.email || 'your email'}</strong>. you can keep going while you wait.
          </p>
          <LxBtn variant="primary" size="lg" onClick={() => navigate('feed')} style={{ minWidth: 200 }}>open feed</LxBtn>
        </div>
      ),
    },
  ];

  const current = steps[step];

  return (
    <div style={{ minHeight: '100vh', background: v.base, display: 'flex', flexDirection: 'column', maxWidth: 480, margin: '0 auto' }}>
      {/* Progress / back */}
      {step > 0 && step < steps.length - 1 && (
        <div style={{ display: 'flex', alignItems: 'center', padding: '14px 16px', gap: 12 }}>
          <button onClick={back} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 4 }}>
            <LxIcon name="back" size={20} color={v.ink} />
          </button>
          <div style={{ flex: 1, display: 'flex', gap: 4 }}>
            {steps.slice(1, -1).map((_, i) => (
              <div key={i} style={{
                flex: 1, height: 3, borderRadius: 2,
                background: i + 1 <= step ? v.accent : v.border,
              }} />
            ))}
          </div>
          <span style={{ fontFamily: v.fontMono, fontSize: 10, color: v.ink3 }}>{step}/{steps.length - 2}</span>
        </div>
      )}

      <div style={{ flex: 1, padding: '20px 24px 24px', display: 'flex', flexDirection: 'column' }}>
        <div style={{ flex: 1 }}>{current.render()}</div>

        {step > 0 && step < steps.length - 1 && (
          <LxBtn
            variant="primary"
            size="lg"
            onClick={() => current.validate() ? next() : null}
            disabled={!current.validate()}
            style={{ marginTop: 24, width: '100%' }}>
            {step === steps.length - 2 ? 'finish' : 'continue'}
          </LxBtn>
        )}
      </div>
    </div>
  );
}

function inputStyle() {
  return {
    width: '100%', fontFamily: v.fontBody, fontSize: 15, color: v.ink,
    background: v.surfaceSunken, border: `1px solid ${v.border}`,
    borderRadius: 8, padding: '11px 14px', outline: 'none',
    boxSizing: 'border-box',
  };
}

Object.assign(window, { OnboardingScreen });

</script>

<script type="text/babel">
// ── App ───────────────────────────────────────────────────────────────────
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#C8A97E",
  "dark": false,
  "font": "syne",
  "density": "cozy",
  "showTags": true
}/*EDITMODE-END*/;

const ACCENT_PALETTES = [
  '#C8A97E',
  '#7A9E7A',
  '#C4847A',
];

const FONT_MAP = {
  syne:  "'Syne', sans-serif",
  serif: "'Instrument Serif', serif",
};

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = useState('feed');
  const [params, setParams] = useState({});
  const [history, setHistory] = useState([]);
  const viewport = useViewport();

  const navigate = (to, p = {}) => {
    setHistory(h => screen !== to ? [...h, screen] : h);
    setScreen(to);
    setParams(p);
    window.scrollTo(0, 0);
  };

  useEffect(() => {
    const root = document.documentElement;
    root.setAttribute('data-theme', t.dark ? 'dark' : 'light');
    root.setAttribute('data-density', t.density);
    root.style.setProperty('--lx-accent', t.accent);
    root.style.setProperty('--lx-accent-dim',
      `color-mix(in srgb, ${t.accent} ${t.dark ? '22%' : '28%'}, var(--lx-base))`);
    root.style.setProperty('--lx-accent-dark',
      `color-mix(in srgb, ${t.accent} 78%, #000)`);
    root.style.setProperty('--lx-accent-text',
      t.dark ? `color-mix(in srgb, ${t.accent} 60%, #fff)` : `color-mix(in srgb, ${t.accent} 60%, #000)`);
    root.style.setProperty('--font-display', FONT_MAP[t.font] || FONT_MAP.syne);
  }, [t.dark, t.accent, t.font, t.density]);

  const screenProps = { navigate, params, tweaks: t, viewport };

  if (screen === 'onboarding') {
    return <><OnboardingScreen {...screenProps} /><MyTweaks t={t} setTweak={setTweak} navigate={navigate} /></>;
  }

  const screens = {
    feed:          <FeedScreen          {...screenProps} />,
    explore:       <ExploreScreen       {...screenProps} />,
    compose:       <ComposerScreen      {...screenProps} />,
    post:          <PostDetailScreen    {...screenProps} />,
    profile:       <ProfileScreen       {...screenProps} />,
    notifications: <NotificationsScreen {...screenProps} />,
    settings:      <SettingsScreen      {...screenProps} />,
  };

  const isStory = screen === 'story-view' || screen === 'story-compose';
  if (isStory) {
    const baseScreen = [...history].reverse().find(s => s !== 'story-view' && s !== 'story-compose' && s !== 'onboarding') || 'feed';
    const baseShowRail = (baseScreen === 'feed' || baseScreen === 'explore') && viewport === 'desktop';
    const Overlay = screen === 'story-view' ? StoryViewScreen : StoryComposerScreen;
    return (
      <>
        <LxShell screen={baseScreen} navigate={navigate} params={{}} showRightRail={baseShowRail}>
          {screens[baseScreen] || screens.feed}
        </LxShell>
        <Overlay {...screenProps} />
        <MyTweaks t={t} setTweak={setTweak} navigate={navigate} />
      </>
    );
  }

  const showRail = (screen === 'feed' || screen === 'explore') && viewport === 'desktop';

  return (
    <>
      <LxShell screen={screen} navigate={navigate} params={params} showRightRail={showRail}>
        {screens[screen] || screens.feed}
      </LxShell>
      <MyTweaks t={t} setTweak={setTweak} navigate={navigate} />
    </>
  );
}

function MyTweaks({ t, setTweak, navigate }) {
  return (
    <TweaksPanel>
      <TweakSection label="Theme" />
      <TweakColor
        label="Accent"
        value={t.accent}
        options={ACCENT_PALETTES}
        onChange={(v) => setTweak('accent', v)} />

      <TweakSection label="Typography" />
      <TweakRadio
        label="Display font"
        value={t.font}
        options={['syne', 'serif']}
        onChange={(v) => setTweak('font', v)} />

      <TweakSection label="Feed" />
      <TweakRadio
        label="Density"
        value={t.density}
        options={['cozy', 'dense']}
        onChange={(v) => setTweak('density', v)} />
      <TweakToggle
        label="Show tags"
        value={t.showTags}
        onChange={(v) => setTweak('showTags', v)} />

      <TweakSection label="Jump to" />
      <TweakButton label="Onboarding" onClick={() => navigate('onboarding')} />
      <TweakButton label="Story viewer" onClick={() => navigate('story-view')} />
      <TweakButton label="Story composer" onClick={() => navigate('story-compose')} />
      <TweakButton label="Settings" onClick={() => navigate('settings')} />
    </TweaksPanel>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
